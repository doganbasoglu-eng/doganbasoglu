<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABOMAK MAKİNE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 font-sans select-none flex flex-col items-center justify-start sm:justify-center min-h-screen sm:h-screen overflow-x-hidden m-0 text-slate-100">

    <!-- MOBİL GÖRÜNÜM KAPSAYICISI -->
    <div class="w-full min-h-screen sm:min-h-0 sm:h-[90vh] sm:max-w-[386px] sm:border-2 sm:border-slate-800 sm:rounded-2xl sm:shadow-2xl bg-slate-900 flex flex-col relative overflow-hidden">

        <!-- ÜST BAŞLIK -->
        <header class="relative bg-slate-900 text-amber-400 py-3 px-4 flex justify-between items-center border-b border-slate-800 shrink-0">
           <h1 style="font-size: 24px;" class="font-bold tracking-widest mx-auto bankgothic-font">LABOMAK MAKİNE</h1>
            <div id="connectionStatus" class="w-3 h-3 rounded-full bg-red-500 border border-slate-900 absolute right-4 shadow" title="Bağlantı Yok"></div>
        </header>

        <!-- ORTA İÇERİK ALANI (Kaydırılabilir) -->
        <div class="flex-1 overflow-y-auto p-3 space-y-3 custom-scrollbar">

            <!-- ANA EKRAN (TEST SAYFASI) -->
            <div id="mainScreen" class="flex flex-col space-y-3">

                <!-- Kuvvet -->
                <div class="flex items-center space-x-2 bg-slate-800/80 p-2 rounded-xl border border-slate-700/60 shadow">
                    <button onclick="sendCommand('B')" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 font-bold px-3 py-4 rounded-lg shadow active:bg-slate-500 text-base">&gt;0&lt;</button>
                    <span class="text-lg font-bold w-14 text-left text-amber-400">Kuvvet</span>
                    <div class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 flex justify-between items-center shadow-inner">
                        <span id="valF" class="text-2xl font-mono font-bold tracking-wide text-white text-right flex-1 pr-2">0.000</span>
                        <span id="unitF" class="text-lg font-semibold text-slate-400 w-10 text-right">kg</span>
                    </div>
                </div>

                <!-- Fmax -->
                <div class="flex items-center space-x-2 bg-slate-800/80 p-2 rounded-xl border border-slate-700/60 shadow">
                    <button onclick="sendCommand('F')" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 font-bold px-3 py-4 rounded-lg shadow active:bg-slate-500 text-base">&gt;0&lt;</button>
                    <span class="text-lg font-bold w-14 text-left text-amber-400">Fmax</span>
                    <div class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 flex justify-between items-center shadow-inner">
                        <span id="valP" class="text-2xl font-mono font-bold tracking-wide text-white text-right flex-1 pr-2">0.000</span>
                        <span id="unitP" class="text-lg font-semibold text-slate-400 w-10 text-right">kg</span>
                    </div>
                </div>

                <!-- Strok -->
                <div class="flex items-center space-x-2 bg-slate-800/80 p-2 rounded-xl border border-slate-700/60 shadow">
                    <button onclick="sendCommand('E')" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 font-bold px-3 py-4 rounded-lg shadow active:bg-slate-500 text-base">&gt;0&lt;</button>
                    <span class="text-lg font-bold w-14 text-left text-amber-400">Strok</span>
                    <div class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 flex justify-between items-center shadow-inner">
                        <span id="valD" class="text-2xl font-mono font-bold tracking-wide text-white text-right flex-1 pr-2">0.000</span>
                        <span class="text-lg font-semibold text-slate-400 w-10 text-right">mm</span>
                    </div>
                </div>

                <!-- İŞLEM BUTONLARI -->
                <div class="grid grid-cols-3 gap-2 pt-1">
                    <button onclick="addDataRow()" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 font-semibold py-3 rounded-xl shadow active:bg-slate-600 text-sm">EKLE</button>
                    <button onclick="sendDataViaSystemShare()" class="bg-emerald-600 hover:bg-emerald-500 border border-emerald-500 text-white font-bold py-3 rounded-xl shadow active:bg-emerald-700 text-sm">GÖNDER</button>
                    <button onclick="clearTable()" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 font-semibold py-3 rounded-xl shadow active:bg-slate-600 text-sm">TEMİZLE</button>
                </div>

                <!-- TABLO -->
                <div class="bg-slate-950/60 border border-slate-800 rounded-xl shadow-inner max-h-44 overflow-y-auto p-2">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="border-b border-slate-800 text-amber-400 font-semibold">
                                <th class="p-1.5">#</th>
                                <th class="p-1.5">Kuvvet</th>
                                <th class="p-1.5">Fmax</th>
                                <th class="p-1.5">Strok</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody" class="font-mono text-slate-300"></tbody>
                    </table>
                </div>
            </div>

            <!-- KALİBRASYON SAYFASI -->
            <div id="calibrationScreen" class="flex flex-col space-y-4 hidden">
                <div class="flex flex-col space-y-1.5">
                    <label class="text-slate-300 font-semibold text-sm">Kuvvet birimi</label>
                    <div class="flex space-x-2">
                        <button type="button" id="btnKg" onclick="onUnitButton('kg')" class="flex-1 bg-slate-800 border border-slate-700 py-2.5 rounded-xl font-semibold shadow text-slate-200">kg</button>
                        <button type="button" id="btnN" onclick="onUnitButton('N')" class="flex-1 bg-slate-800 border border-slate-700 py-2.5 rounded-xl font-semibold shadow text-slate-200">N</button>
                    </div>
                </div>

                <div class="flex flex-col space-y-1.5">
                    <label class="text-slate-300 font-semibold text-sm">Loadcell kapasitesi</label>
                    <select id="loadcellCapacity" onchange="onCapacityChange(this)" class="bg-slate-950 border border-slate-700 p-3 rounded-xl shadow-inner text-base font-mono text-slate-200">
                        <option value="0">1 kg</option>
                        <option value="1">2 kg</option>
                        <option value="2">5 kg</option>
                        <option value="3">10 kg</option>
                        <option value="4">20 kg</option>
                        <option value="5">25 kg</option>
                        <option value="6">50 kg</option>
                        <option value="7">100 kg</option>
                        <option value="8">200 kg</option>
                    </select>
                </div>

                <div class="flex flex-col space-y-1.5">
                    <label class="text-slate-300 font-semibold text-sm">Referans kuvvet</label>
                    <div class="flex items-center space-x-2">
                        <input type="number" id="refForceInput" value="0" step="0.001" class="flex-1 bg-slate-950 border border-slate-700 p-3 rounded-xl shadow-inner text-base font-mono text-slate-200">
                         <span id="Span6" class="text-lg font-semibold text-slate-400 w-10 text-left">kg</span>
                    </div>
                </div>

                <div class="pt-2">
                    <button onclick="saveCalibration()" class="w-full bg-emerald-600 hover:bg-emerald-500 border border-emerald-500 text-white font-bold py-3.5 rounded-xl shadow active:bg-emerald-700 text-base">Tamam</button>
                      
                    <div class="flex flex-col space-y-1 mb-5 mt-3">
                        <span class="text-xs font-semibold text-slate-400">1. Loadcell kapasitesini seçiniz.</span>
                        <span class="text-xs font-semibold text-slate-400">2. Cihaza bilinen bir ağırlık uygulayın ve bu değeri referans kuvvet kısmına yazın.</span>
                        <span class="text-xs font-semibold text-slate-400">3. Tamam butonuna basarak kalibre edin.</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- ALT MENÜ (Sabit) -->
        <footer class="bg-slate-900 border-t border-slate-800 p-3 flex flex-col space-y-2 shadow-lg shrink-0">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="connectBluetooth()" id="btnConnect" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold py-2.5 rounded-xl shadow text-sm">BAĞLAN</button>
                <button onclick="disconnectBluetooth()" id="btnDisconnect" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold py-2.5 rounded-xl shadow text-sm">BAĞLANTIYI KES</button>
            </div>
            <button onclick="toggleScreen()" id="btnScreenToggle" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-400 font-bold py-2.5 rounded-xl shadow text-sm">KALİBRASYON</button>
        </footer>

    </div>

    <script>
        let bluetoothDevice = null;
        let bluetoothNotifyChar = null;
        let bluetoothWriteChar = null;
        let rxBuffer = '';

        let currentScreen = 'main';
        let selectedUnit = 'kg';

        let rawF = 0, rawP = 0, rawD = 0;
        let rawPointLoc = 3; 
        let isUpdatingFromDevice = false;
        let isUpdatingUnitLocally = false;

        function setConnected(ok) {
            const el = document.getElementById('connectionStatus');
            el.className = `w-3 h-3 rounded-full ${ok ? 'bg-emerald-500' : 'bg-red-500'} border border-slate-900 absolute right-4 shadow`;
            el.title = ok ? 'Bağlı' : 'Bağlantı Yok';
        }

        const DEVICE_SENDS_CONVERTED = false;

        function convertForce(v) {
            return (!DEVICE_SENDS_CONVERTED && selectedUnit === 'N') ? v * 9.80665 : v;
        }

        function onUnitButton(unit) {
            isUpdatingUnitLocally = true;
            setForceUnit(unit);
            sendCommand(unit === 'N' ? 'A1' : 'A0');
            setTimeout(() => { isUpdatingUnitLocally = false; }, 300);
        }

        function setForceUnit(unit) {
            selectedUnit = unit;
            const on = "flex-1 bg-amber-500/20 border border-amber-500 py-2.5 rounded-xl font-bold shadow text-amber-400";
            const off = "flex-1 bg-slate-800 border border-slate-700 py-2.5 rounded-xl font-semibold shadow text-slate-200";
            document.getElementById('btnKg').className = unit === 'kg' ? on : off;
            document.getElementById('btnN').className = unit === 'N' ? on : off;
            document.getElementById('refUnitLabel').innerText = unit;
            updateDisplayValues();
        }

        function toggleScreen() {
            const mainScr = document.getElementById('mainScreen');
            const calibScr = document.getElementById('calibrationScreen');
            const toggleBtn = document.getElementById('btnScreenToggle');

            if (currentScreen === 'main') {
                mainScr.classList.add('hidden');
                calibScr.classList.remove('hidden');
                toggleBtn.innerText = "ANA EKRAN";
                currentScreen = 'calibration';
                setForceUnit(selectedUnit);
            } else {
                calibScr.classList.add('hidden');
                mainScr.classList.remove('hidden');
                toggleBtn.innerText = "KALİBRASYON";
                currentScreen = 'main';
            }
        }

        function onCapacityChange(selectElement) {
            if (isUpdatingFromDevice) return;
            sendCommand(`C${selectElement.value}`);
        }

        function saveCalibration() {
            let inputVal = parseFloat(document.getElementById('refForceInput').value) || 0;
            let multiplier = Math.pow(10, rawPointLoc);
            let scaledVal = Math.round(inputVal * multiplier);
            
            sendCommand(`D${scaledVal}`);
            toggleScreen();
        }

        async function connectBluetooth() {
            try {
                if (!navigator.bluetooth) {
                    alert("Tarayıcınız Web Bluetooth desteklemiyor!");
                    return;
                }

                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '0000ffe0-0000-1000-8000-00805f9b34fb',
                        '6e400001-b5a3-f393-a0a9-ecbd0e32c6e5',
                        '4fafc201-1fb5-459e-8fcc-c5c9c331914b'
                    ]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    setConnected(false);
                    bluetoothNotifyChar = null;
                    bluetoothWriteChar = null;
                    rxBuffer = '';
                });

                const server = await bluetoothDevice.gatt.connect();
                const services = await server.getPrimaryServices();

                for (const service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (const c of characteristics) {
                        if (!bluetoothWriteChar && (c.properties.write || c.properties.writeWithoutResponse)) {
                            bluetoothWriteChar = c;
                        }
                        if (!bluetoothNotifyChar && c.properties.notify) {
                            bluetoothNotifyChar = c;
                            await c.startNotifications();
                            c.addEventListener('characteristicvaluechanged', handleIncomingData);
                        }
                    }
                }

                setConnected(true);
            } catch (error) {
                console.log("Bluetooth bağlantı hatası: ", error);
                alert("Bağlantı hatası: " + error.message);
            }
        }

        function disconnectBluetooth() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            setConnected(false);
        }

        async function sendCommand(cmd) {
            if (!bluetoothWriteChar) {
                console.log("Yazma karakteristiği yok, komut gönderilmedi:", cmd);
                return;
            }
            try {
                const data = new TextEncoder().encode(cmd + '\n');
                if (bluetoothWriteChar.properties.writeWithoutResponse) {
                    await bluetoothWriteChar.writeValueWithoutResponse(data);
                } else {
                    await bluetoothWriteChar.writeValue(data);
                }
            } catch (err) {
                console.log("Komut gönderme hatası:", err);
            }
        }

        function handleIncomingData(event) {
            rxBuffer += new TextDecoder('utf-8').decode(event.target.value);
            let idx;
            while ((idx = rxBuffer.indexOf('\n')) >= 0) {
                const line = rxBuffer.slice(0, idx).trim();
                rxBuffer = rxBuffer.slice(idx + 1);
                if (line) parseAndDisplayData(line);
            }
        }

        function parseAndDisplayData(dataStr) {
            const parts = dataStr.split('|');
            if (parts.length >= 3) {
                // Büyük ve ondalıklı sayıların (double/float) güvenle işlenmesi
                rawF = parseFloat(parts[0].replace(',', '.')) || 0;
                rawP = parseFloat(parts[1].replace(',', '.')) || 0;
                rawD = parseFloat(parts[2].replace(',', '.')) || 0;

                if (parts[3] !== undefined) {
                    const capIndex = parts[3].trim();
                    const selectEl = document.getElementById('loadcellCapacity');
                    for (const opt of selectEl.options) {
                        if (opt.value === capIndex) {
                            if (selectEl.value !== capIndex) {
                                isUpdatingFromDevice = true;
                                selectEl.value = capIndex;
                                isUpdatingFromDevice = false;
                            }
                            break;
                        }
                    }
                }

                if (parts[4] !== undefined) {
                    rawPointLoc = parseInt(parts[4].trim(), 10) || 3;
                    document.getElementById('refForceInput').step = Math.pow(10, -rawPointLoc).toFixed(rawPointLoc);
                }

                if (parts[5] !== undefined && !isUpdatingUnitLocally) {
                    const u = parts[5].trim() === '1' ? 'N' : 'kg';
                    if (u !== selectedUnit) {
                        selectedUnit = u;
                        const on = "flex-1 bg-amber-500/20 border border-amber-500 py-2.5 rounded-xl font-bold shadow text-amber-400";
                        const off = "flex-1 bg-slate-800 border border-slate-700 py-2.5 rounded-xl font-semibold shadow text-slate-200";
                        document.getElementById('btnKg').className = u === 'kg' ? on : off;
                        document.getElementById('btnN').className = u === 'N' ? on : off;
                        document.getElementById('refUnitLabel').innerText = u;
                    }
                }
                updateDisplayValues();
            }
        }

        function updateDisplayValues() {
            const dispF = convertForce(rawF);
            const dispP = convertForce(rawP);
            const unitStr = selectedUnit;
            document.getElementById('valF').innerText = dispF.toFixed(rawPointLoc);
            document.getElementById('unitF').innerText = unitStr;
            document.getElementById('valP').innerText = dispP.toFixed(rawPointLoc);
            document.getElementById('unitP').innerText = unitStr;
            document.getElementById('valD').innerText = rawD.toFixed(3);
        }

        let tableDataRows = [];

        function addDataRow() {
            const dispF = convertForce(rawF);
            const dispP = convertForce(rawP);
            tableDataRows.push({
                f: dispF.toFixed(rawPointLoc) + " " + selectedUnit,
                p: dispP.toFixed(rawPointLoc) + " " + selectedUnit,
                d: rawD.toFixed(3) + " mm"
            });
            renderTable();
        }

        function clearTable() {
            tableDataRows = [];
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = tableDataRows.map((row, index) => `
                <tr class="border-b border-slate-800/80">
                    <td class="p-1.5">${index + 1}</td>
                    <td class="p-1.5">${row.f}</td>
                    <td class="p-1.5">${row.p}</td>
                    <td class="p-1.5">${row.d}</td>
                </tr>`).join(',');
        }

        setForceUnit('kg');

        async function sendDataViaSystemShare() {
            if (tableDataRows.length === 0) {
                alert("Listede gönderilecek veri bulunmuyor!");
                return;
            }

            let csvContent = "Sira,Kuvvet,Fmax,Strok\n";
            tableDataRows.forEach((row, idx) => {
                csvContent += `${idx + 1},${row.f},${row.p},${row.d}\n`;
            });

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'LABOMAK Test Sonuçları',
                        text: csvContent
                    });
                } catch (err) {
                    console.log('Paylaşım iptal edildi veya hata oluştu:', err);
                }
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(csvContent)}`, '_blank');
            }
        }
    </script>
</body>
</html>
