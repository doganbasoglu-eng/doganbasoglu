<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>51 Oyunu Skor Takip</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0d1520; 
            color: #f8fafc; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .glass-card { 
            background: rgba(30, 41, 59, 0.75); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .glow-amber {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6">

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col gap-5">
        
        <!-- Header -->
        <header class="glass-card rounded-2xl p-4 shadow-xl flex justify-between items-center border-amber-500/20">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-slate-950 font-black text-xl sm:text-2xl shadow-lg">
                    51
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-extrabold text-amber-400">
                        Hadi abi...
                    </h1>
                    <p class="text-xs text-slate-400">Bol şanslar</p>
                </div>
            </div>

            <button id="reset-btn" type="button" class="hidden px-3 py-2 bg-rose-950/80 hover:bg-rose-900 border border-rose-700/60 text-rose-200 text-xs sm:text-sm rounded-xl transition font-semibold flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Yeni Oyun</span>
            </button>
        </header>

        <!-- SETUP SECTION -->
        <div id="setup-section" class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl border border-amber-500/30 my-auto glow-amber">
            <div class="text-center max-w-md mx-auto mb-6">
                <div class="w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30 flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-users"></i>
                </div>
                <h2 class="text-xl sm:text-2xl font-bold text-white mb-1">Oyuncuları Girin</h2>
                <p class="text-xs sm:text-sm text-slate-400">Oyuna başlamak için 4 oyuncunun adını yazın.</p>
            </div>

            <div class="max-w-md mx-auto space-y-3.5">
                <div class="grid grid-cols-1 gap-3">
                    <div class="relative">
                        <span class="absolute left-3.5 top-2.5 text-amber-400 font-bold text-xs">#1</span>
                        <input type="text" id="p0-name" value="" class="w-full pl-10 pr-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white font-medium focus:outline-none focus:border-amber-400 text-sm">
                    </div>
                    <div class="relative">
                        <span class="absolute left-3.5 top-2.5 text-amber-400 font-bold text-xs">#2</span>
                        <input type="text" id="p1-name" value="" class="w-full pl-10 pr-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white font-medium focus:outline-none focus:border-amber-400 text-sm">
                    </div>
                    <div class="relative">
                        <span class="absolute left-3.5 top-2.5 text-amber-400 font-bold text-xs">#3</span>
                        <input type="text" id="p2-name" value="" class="w-full pl-10 pr-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white font-medium focus:outline-none focus:border-amber-400 text-sm">
                    </div>
                    <div class="relative">
                        <span class="absolute left-3.5 top-2.5 text-amber-400 font-bold text-xs">#4</span>
                        <input type="text" id="p3-name" value="" class="w-full pl-10 pr-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white font-medium focus:outline-none focus:border-amber-400 text-sm">
                    </div>
                </div>

                <button id="start-game-btn" type="button" class="w-full py-3.5 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black rounded-xl shadow-lg transition flex items-center justify-center gap-2 uppercase tracking-wider text-sm cursor-pointer mt-2">
                    <i class="fa-solid fa-play"></i> Oyunu Başlat
                </button>
            </div>
        </div>

        <!-- MAIN GAME SECTION -->
        <div id="game-section" class="hidden flex-col gap-5">
            
            <!-- TOTAL SCORES HEADER -->
            <div class="glass-card rounded-2xl p-4 shadow-xl">
                <div class="text-xs uppercase tracking-wider font-bold text-amber-400 mb-3 flex justify-between items-center">
                    <span><i class="fa-solid fa-trophy mr-1.5"></i> Toplam Skorlar</span>
                    <span id="round-count" class="text-[11px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md border border-slate-700">El: 0</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5" id="totals-container">
                    <!-- Cards will be inserted here dynamically -->
                </div>
            </div>

            <!-- ROUND ENTRY FORM -->
            <div class="glass-card rounded-2xl p-4 sm:p-5 shadow-xl border border-slate-700">
                <div class="flex flex-wrap items-center justify-between gap-3 pb-3.5 border-b border-slate-700/80 mb-4">
                    
                    <!-- Color Selector -->
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-400 font-semibold">Yer Rengi:</span>
                        <div class="flex gap-1.5">
                            <label class="cursor-pointer">
                                <input type="radio" name="round-color" value="black" checked class="hidden peer" id="color-black">
                                <span class="px-2.5 py-1.5 rounded-lg border border-slate-600 bg-slate-800/80 text-slate-300 text-xs font-bold peer-checked:bg-slate-100 peer-checked:text-slate-950 peer-checked:border-white transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-circle text-[9px]"></i> Siyah (1x)
                                </span>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="round-color" value="red" class="hidden peer" id="color-red">
                                <span class="px-2.5 py-1.5 rounded-lg border border-rose-900 bg-rose-950/40 text-rose-300 text-xs font-bold peer-checked:bg-rose-600 peer-checked:text-white peer-checked:border-rose-400 transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-circle text-[9px] text-rose-500 peer-checked:text-white"></i> Kırmızı (2x)
                                </span>
                            </label>
                        </div>
                    </div>

                    <!-- Bitme Şekli (Joker & Çift) -->
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-400 font-semibold">Bitme Şekli:</span>
                        <div class="flex gap-1.5">
                            <label class="cursor-pointer select-none">
                                <input type="checkbox" id="opt-joker" class="hidden peer">
                                <span class="px-2.5 py-1.5 rounded-lg border border-purple-800 bg-purple-950/40 text-purple-300 text-xs font-bold peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-400 transition inline-block">
                                    🃏 Joker
                                </span>
                            </label>
                            <label class="cursor-pointer select-none">
                                <input type="checkbox" id="opt-cift" class="hidden peer">
                                <span class="px-2.5 py-1.5 rounded-lg border border-blue-800 bg-blue-950/40 text-blue-300 text-xs font-bold peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-400 transition inline-block">
                                    👥 Çift
                                </span>
                            </label>
                        </div>
                    </div>

                    <!-- Katsayı Indicator -->
                    <div class="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-extrabold px-3 py-1.5 rounded-lg ml-auto" id="multiplier-badge">
                        Katsayı: 1x
                    </div>
                </div>

                <!-- Input Grid -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
                    <!-- Player 1 -->
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-2">
                            <span id="form-name-0" class="text-xs font-bold text-slate-200 truncate max-w-[80px]">P1</span>
                            <button type="button" id="winner-btn-0" class="px-2 py-0.5 rounded border border-slate-700 bg-slate-800 text-slate-400 text-[10px] font-extrabold hover:text-white transition cursor-pointer">
                                BITTI
                            </button>
                        </div>
                        <input type="number" id="p0-input" placeholder="Puan" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-center font-bold text-white text-base focus:outline-none focus:border-amber-400">
                    </div>

                    <!-- Player 2 -->
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-2">
                            <span id="form-name-1" class="text-xs font-bold text-slate-200 truncate max-w-[80px]">P2</span>
                            <button type="button" id="winner-btn-1" class="px-2 py-0.5 rounded border border-slate-700 bg-slate-800 text-slate-400 text-[10px] font-extrabold hover:text-white transition cursor-pointer">
                                BITTI
                            </button>
                        </div>
                        <input type="number" id="p1-input" placeholder="Puan" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-center font-bold text-white text-base focus:outline-none focus:border-amber-400">
                    </div>

                    <!-- Player 3 -->
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-2">
                            <span id="form-name-2" class="text-xs font-bold text-slate-200 truncate max-w-[80px]">P3</span>
                            <button type="button" id="winner-btn-2" class="px-2 py-0.5 rounded border border-slate-700 bg-slate-800 text-slate-400 text-[10px] font-extrabold hover:text-white transition cursor-pointer">
                                BITTI
                            </button>
                        </div>
                        <input type="number" id="p2-input" placeholder="Puan" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-center font-bold text-white text-base focus:outline-none focus:border-amber-400">
                    </div>

                    <!-- Player 4 -->
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-2">
                            <span id="form-name-3" class="text-xs font-bold text-slate-200 truncate max-w-[80px]">P4</span>
                            <button type="button" id="winner-btn-3" class="px-2 py-0.5 rounded border border-slate-700 bg-slate-800 text-slate-400 text-[10px] font-extrabold hover:text-white transition cursor-pointer">
                                BITTI
                            </button>
                        </div>
                        <input type="number" id="p3-input" placeholder="Puan" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-center font-bold text-white text-base focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <button id="save-round-btn" type="button" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer text-sm sm:text-base">
                    <i class="fa-solid fa-plus-circle"></i> Eli Tamamla ve Puanları Kaydet
                </button>
            </div>

            <!-- HISTORY TABLE -->
            <div class="glass-card rounded-2xl p-4 shadow-xl overflow-hidden">
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                    <i class="fa-solid fa-list-check text-amber-400"></i> El Detayları Tablosu
                </h3>
                <div class="overflow-x-auto rounded-xl border border-slate-800">
                    <table class="w-full text-left text-xs sm:text-sm">
                        <thead class="bg-slate-900/90 text-amber-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                            <tr>
                                <th class="py-2.5 px-3 text-center">El</th>
                                <th class="py-2.5 px-3 text-center">Mod</th>
                                <th class="py-2.5 px-3 text-center" id="th-p0">P1</th>
                                <th class="py-2.5 px-3 text-center" id="th-p1">P2</th>
                                <th class="py-2.5 px-3 text-center" id="th-p2">P3</th>
                                <th class="py-2.5 px-3 text-center" id="th-p3">P4</th>
                                <th class="py-2.5 px-3 text-center">Sil</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody" class="divide-y divide-slate-800/80 font-mono bg-slate-900/40">
                            <!-- Rows injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

 
    <script>
        // State
        const state = {
            players: ["Oyuncu 1", "Oyuncu 2", "Oyuncu 3", "Oyuncu 4"],
            rounds: [],
            winnerIndex: null
        };

        // Run when DOM is completely ready
        window.addEventListener('DOMContentLoaded', () => {
            
            // Elements
            const setupSection = document.getElementById('setup-section');
            const gameSection = document.getElementById('game-section');
            const startGameBtn = document.getElementById('start-game-btn');
            const saveRoundBtn = document.getElementById('save-round-btn');
            const resetBtn = document.getElementById('reset-btn');

            const optJoker = document.getElementById('opt-joker');
            const optCift = document.getElementById('opt-cift');
            const colorBlack = document.getElementById('color-black');
            const colorRed = document.getElementById('color-red');
            const multiplierBadge = document.getElementById('multiplier-badge');

            // Winner Buttons
            for (let i = 0; i < 4; i++) {
                document.getElementById(`winner-btn-${i}`).addEventListener('click', () => toggleWinner(i));
            }

            // Multiplier Listeners
            [optJoker, optCift, colorBlack, colorRed].forEach(el => {
                el.addEventListener('change', updateMultiplierDisplay);
            });

            // Start Game Trigger
            startGameBtn.addEventListener('click', () => {
                state.players = [
                    document.getElementById('p0-name').value.trim() || "Oyuncu 1",
                    document.getElementById('p1-name').value.trim() || "Oyuncu 2",
                    document.getElementById('p2-name').value.trim() || "Oyuncu 3",
                    document.getElementById('p3-name').value.trim() || "Oyuncu 4"
                ];

                for (let i = 0; i < 4; i++) {
                    document.getElementById(`form-name-${i}`).textContent = state.players[i];
                    document.getElementById(`th-p${i}`).textContent = state.players[i];
                }

                setupSection.classList.add('hidden');
                gameSection.classList.remove('hidden');
                gameSection.classList.add('flex');
                resetBtn.classList.remove('hidden');

                renderUI();
            });

            // Save Round Trigger
            saveRoundBtn.addEventListener('click', () => {
                const mult = calculateMultiplier();
                const scores = [];

                for (let i = 0; i < 4; i++) {
                    if (state.winnerIndex === i) {
                        scores.push(-100 * 1);
                    } else {
                        const val = parseFloat(document.getElementById(`p${i}-input`).value) || 0;
                        scores.push(val * mult);
                    }
                }

                state.rounds.push({
                    color: colorRed.checked ? 'red' : 'black',
                    joker: optJoker.checked,
                    cift: optCift.checked,
                    mult: mult,
                    scores: scores,
                    winner: state.winnerIndex
                });

                // Reset Round Inputs and Options (Joker/Çift/Color)
                state.winnerIndex = null;
                optJoker.checked = false;
                optCift.checked = false;
                colorBlack.checked = true;

                for (let i = 0; i < 4; i++) {
                    const inp = document.getElementById(`p${i}-input`);
                    inp.disabled = false;
                    inp.value = '';
                }
                resetWinnerButtons();
                updateMultiplierDisplay();

                renderUI();
            });

            // Reset Game Trigger
            resetBtn.addEventListener('click', () => {
                state.rounds = [];
                state.winnerIndex = null;
                setupSection.classList.remove('hidden');
                gameSection.classList.add('hidden');
                gameSection.classList.remove('flex');
                resetBtn.classList.add('hidden');
            });

            // Calculate Multiplier Logic
            function calculateMultiplier() {
                const isJoker = optJoker.checked;
                const isCift = optCift.checked;
                const isRed = colorRed.checked;

                if (isRed==false && isJoker && isCift) return 4;
                if (isRed==false && isJoker) return 2;
               



                if (isJoker && isCift) return 8;
                if (isJoker || isCift) return 4;
                if (isRed) return 2;

              

                return 1;
            }





            function updateMultiplierDisplay() {
                const mult = calculateMultiplier();
                multiplierBadge.textContent = `Katsayı: ${mult}x`;
            }






            // Winner Selection Logic
            function toggleWinner(idx) {
                const input = document.getElementById(`p${idx}-input`);

                if (state.winnerIndex === idx) {
                    state.winnerIndex = null;
                    input.value = '';
                    input.disabled = false;
                    resetWinnerButtons();
                } else {
                    if (state.winnerIndex !== null) {
                        const prevInput = document.getElementById(`p${state.winnerIndex}-input`);
                        prevInput.value = '';
                        prevInput.disabled = false;
                    }
                    state.winnerIndex = idx;
                    input.value = '-100';
                    input.disabled = true;
                    resetWinnerButtons();

                    const btn = document.getElementById(`winner-btn-${idx}`);
                    btn.className = "px-2 py-0.5 rounded border border-amber-400 bg-amber-500 text-slate-950 text-[10px] font-black shadow transition cursor-pointer";
                }
            }

            function resetWinnerButtons() {
                for (let i = 0; i < 4; i++) {
                    if (state.winnerIndex !== i) {
                        document.getElementById(`winner-btn-${i}`).className = "px-2 py-0.5 rounded border border-slate-700 bg-slate-800 text-slate-400 text-[10px] font-extrabold hover:text-white transition cursor-pointer";
                    }
                }
            }

            // Global Scope for Delete Function
            window.deleteRound = function(index) {
                state.rounds.splice(index, 1);
                renderUI();
            };

            // Main Render Function
            function renderUI() {
                // Calculate Cumulative Totals
                const totals = [0, 0, 0, 0];
                state.rounds.forEach(r => {
                    r.scores.forEach((s, idx) => totals[idx] += s);
                });

                // Render Top Player Total Cards
                const totalsContainer = document.getElementById('totals-container');
                totalsContainer.innerHTML = '';

                const minScore = totals.length > 0 ? Math.min(...totals) : 0;

                for (let i = 0; i < 4; i++) {
                    const isLeader = totals[i] === minScore && state.rounds.length > 0;
                    const card = `
                        <div class="bg-slate-900/80 p-3 rounded-xl border ${isLeader ? 'border-amber-400 bg-amber-500/10' : 'border-slate-800'} text-center relative overflow-hidden transition">
                            ${isLeader ? '<span class="absolute top-0 right-0 bg-amber-400 text-slate-950 text-[9px] font-black px-1.5 py-0.2 rounded-bl">LİDER</span>' : ''}
                            <div class="text-xs text-slate-400 font-semibold truncate mb-1">${state.players[i]}</div>
                            <div class="text-2xl font-black ${isLeader ? 'text-amber-300' : 'text-white'}">${totals[i]}</div>
                        </div>
                    `;
                    totalsContainer.innerHTML += card;
                }

                document.getElementById('round-count').textContent = `El: ${state.rounds.length}`;

                // Render Round History Table
                const tbody = document.getElementById('history-tbody');
                tbody.innerHTML = '';

                if (state.rounds.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="text-center py-6 text-slate-500 italic text-xs">
                                Henüz el eklenmedi. Puanları girip "Eli Tamamla" butonuna basın.
                            </td>
                        </tr>
                    `;
                    return;
                }

                [...state.rounds].reverse().forEach((r, revIdx) => {
                    const actualIdx = state.rounds.length - 1 - revIdx;
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-800/40 transition";

                    let modeText = r.color === 'red' ? '<span class="text-rose-400 font-bold">Kırmızı</span>' : 'Siyah';
                    let tags = [];
                    if (r.joker) tags.push('Joker');
                    if (r.cift) tags.push('Çift');
                    if (tags.length > 0) {
                        modeText += ` <span class="text-[10px] text-amber-400">(${tags.join('+')})</span>`;
                    }

                    let rowHtml = `
                        <td class="py-2.5 px-3 text-center font-bold text-slate-400">#${actualIdx + 1}</td>
                        <td class="py-2.5 px-3 text-center text-xs">${modeText} <span class="text-slate-500">x${r.mult}</span></td>
                    `;

                    r.scores.forEach((s, i) => {
                        const isWinner = r.winner === i;
                        const displayVal = isWinner ? `<span class="text-emerald-400 font-bold"> (${s})</span>` : s;
                        rowHtml += `<td class="py-2.5 px-3 text-center ${isWinner ? 'bg-emerald-950/20' : ''}">${displayVal}</td>`;
                    });

                    rowHtml += `
                        <td class="py-2.5 px-3 text-center">
                            <button onclick="deleteRound(${actualIdx})" class="text-slate-500 hover:text-rose-400 transition p-1 cursor-pointer">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    `;

                    tr.innerHTML = rowHtml;
                    tbody.appendChild(tr);
                });
            }
        });
    </script>
</body>
</html>
